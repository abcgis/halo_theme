<!doctype html>
<html
  lang="en"
  xmlns:th="https://www.thymeleaf.org"
  th:fragment="layout (title, content)"
  th:attr="data-theme=${theme.config.style.color_scheme ?: 'system'}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" th:href="${site.favicon ?: '/favicon.ico'}" />
    <title th:text="${title ?: site.title}">Site Title</title>

    <!-- Static assets with version cache-busting -->
    <link
      rel="stylesheet"
      th:href="@{/assets/css/style.css?v={v}(v=${theme.spec.version})}"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      th:title="|${site.title} RSS|"
      th:href="@{/rss.xml}"
    />

    <!-- Halo extended inputs supply `theme.config.style.accent_color`. -->
    <style th:inline="text">
      :root { --color-accent: [[${theme.config.style.accent_color ?: '#3b82f6'}]]; }
    </style>
  </head>
  <body>
    <th:block th:replace="~{modules/header}" />

    <main class="page" id="content" role="main">
      <th:block th:replace="${content}" />
    </main>

    <th:block th:replace="~{modules/footer}" />

    <!-- JS loaded with cache-busting; main.js handles the theme toggle. -->
    <script
      th:src="@{/assets/js/main.js?v={v}(v=${theme.spec.version})}"
      defer
    ></script>
    <!-- Halo footer code-injection point. Keep before </body>. -->
    <halo:footer />
  </body>
</html>
