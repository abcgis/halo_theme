<!-- Site footer: configurable text + RSS link. -->
<footer th:fragment="footer" class="site-footer">
  <div class="container">
    <p th:text="${theme.config.seo?.footer_text ?: (|© ${site.title}|)}">Footer</p>
    <div class="links" th:if="${theme.config.seo?.show_rss}">
      <a th:href="@{/rss.xml}">RSS</a>
      <a th:href="@{/sitemap.xml}">Sitemap</a>
      <a th:href="@{/archives}">Archives</a>
    </div>
  </div>
</footer>
