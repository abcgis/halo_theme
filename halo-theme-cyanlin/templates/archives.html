<!-- Archives page: posts grouped by year then month. -->
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: layout(title = |Archives - ${site.title}|, content = ~{::content})}">
  <th:block th:fragment="content">
    <section class="page-header">
      <div class="container">
        <h1>Archives</h1>
        <p>All posts grouped by publish date.</p>
      </div>
    </section>

    <div class="container">
      <th:block th:if="${archives != null and not #lists.isEmpty(archives.items)}">
        <th:block th:each="archive : ${archives.items}">
          <h2 class="archive-year" th:text="${archive.year}">2024</h2>
          <th:block th:each="month : ${archive.months}">
            <h3 class="archive-month" th:text="|${month.month}|">1</h3>
            <ul class="archive-list">
              <li th:each="post : ${month.posts}">
                <time
                  th:datetime="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
                  th:text="${#temporals.format(post.spec.publishTime, 'MM-dd')}"
                >01-01</time>
                <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">Title</a>
              </li>
            </ul>
          </th:block>
        </th:block>

        <nav class="pagination" th:if="${archives.totalPages != null and archives.totalPages > 1}">
          <a
            th:if="${archives.hasPrevious()}"
            th:href="@{${archives.prevUrl}}"
            rel="prev"
          >&lsaquo; Prev</a>
          <span th:unless="${archives.hasPrevious()}" class="disabled">&lsaquo; Prev</span>

          <th:block th:each="p : ${#numbers.sequence(1, archives.totalPages)}">
            <span th:if="${p == archives.page}" class="current" th:text="${p}">1</span>
            <a
              th:unless="${p == archives.page}"
              th:href="@{|/archives?page=${p}|}"
              th:text="${p}"
            >2</a>
          </th:block>

          <a
            th:if="${archives.hasNext()}"
            th:href="@{${archives.nextUrl}}"
            rel="next"
          >Next &rsaquo;</a>
          <span th:unless="${archives.hasNext()}" class="disabled">Next &rsaquo;</span>
        </nav>
      </th:block>

      <div class="empty" th:unless="${archives != null and not #lists.isEmpty(archives.items)}">
        <p>No archives yet.</p>
      </div>
    </div>
  </th:block>
</html>
