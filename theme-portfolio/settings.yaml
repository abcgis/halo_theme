apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-portfolio-setting
spec:
  forms:
    - group: style
      label: Style
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: Default color scheme
          value: light
          help: Light mode is the default. Choose dark or follow the system.
          options:
            - label: Follow system
              value: system
            - label: Light
              value: light
            - label: Dark
              value: dark
        - $formkit: text
          name: accent_color
          label: Accent color (CSS color)
          value: "#f7b731"
          help: Used for active nav underline, button hover, and links.
    - group: layout
      label: Layout
      formSchema:
        - $formkit: select
          name: posts_per_page
          label: Posts per page (index)
          value: "6"
          options:
            - label: 6
              value: "6"
            - label: 12
              value: "12"
            - label: 24
              value: "24"
        - $formkit: switch
          name: show_sidebar
          label: Show sidebar on post pages
          value: false
          onValue: true
          offValue: false
    - group: seo
      label: Identity & Footer
      formSchema:
        - $formkit: text
          name: site_subtitle
          label: Site subtitle (shown in header)
          value: Selected work & notes
        - $formkit: text
          name: hero_title
          label: Hero title (homepage)
          value: ""
          help: Leave empty to use the site title.
        - $formkit: textarea
          name: footer_text
          label: Footer text
          value: "© 2026. All rights reserved."
        - $formkit: switch
          name: show_rss
          label: Show RSS link in footer
          value: true
          onValue: true
          offValue: false