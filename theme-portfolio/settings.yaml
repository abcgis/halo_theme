apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-portfolio-setting
spec:
  forms:
    - group: style
      label: Style
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: Default color scheme
          value: system
          options:
            - label: Follow system
              value: system
            - label: Light
              value: light
            - label: Dark
              value: dark
        - $formkit: text
          name: accent_color
          label: Accent color (CSS color)
          value: "#3b82f6"
          help: Applied to links, buttons, and focus rings.
    - group: layout
      label: Layout
      formSchema:
        - $formkit: select
          name: posts_per_page
          label: Posts per page (index)
          value: "10"
          options:
            - label: 6
              value: "6"
            - label: 10
              value: "10"
            - label: 20
              value: "20"
        - $formkit: switch
          name: show_sidebar
          label: Show sidebar on post pages
          value: true
          onValue: true
          offValue: false
    - group: seo
      label: SEO & Footer
      formSchema:
        - $formkit: text
          name: site_subtitle
          label: Site subtitle (shown in header)
          value: A Halo 2.x demo theme
        - $formkit: textarea
          name: footer_text
          label: Footer text
          value: "© Halo Demo Theme · Built with Halo 2.x"
        - $formkit: switch
          name: show_rss
          label: Show RSS link in footer
          value: true
          onValue: true
          offValue: false


