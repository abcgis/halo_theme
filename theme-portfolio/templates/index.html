<!--
  Home page — full-viewport hero.
  Hero title/subtitle/CTA animate in with AOS-like delays.
-->
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: layout(title = ${site.title}, content = ~{::content})}">
  <th:block th:fragment="content">
    <section class="hero" aria-label="Introduction">
      <div
        class="hero-bg"
        th:if="${theme.config?.hero?.hero_image != null and not #strings.isEmpty(theme.config.hero.hero_image)}"
        th:style="|background-image: url('${theme.config.hero.hero_image}');|"
      ></div>
      <div
        class="hero-fallback"
        th:unless="${theme.config?.hero?.hero_image != null and not #strings.isEmpty(theme.config.hero.hero_image)}"
      ></div>
      <div class="hero-overlay"></div>

      <h1
        class="title"
        data-aos="fade-down"
        th:if="${theme.config?.hero?.hero_title != null and not #strings.isEmpty(theme.config.hero.hero_title)}"
        th:text="${theme.config.hero.hero_title}"
      >Art in Every Frame</h1>
      <h1
        class="title"
        data-aos="fade-down"
        th:unless="${theme.config?.hero?.hero_title != null and not #strings.isEmpty(theme.config.hero.hero_title)}"
        th:text="${site.title}"
      >Site Title</h1>

      <p
        class="subtitle"
        data-aos="fade-up"
        data-aos-delay="200"
        th:if="${theme.config?.hero?.hero_subtitle != null and not #strings.isEmpty(theme.config.hero.hero_subtitle)}"
        th:text="${theme.config.hero.hero_subtitle}"
      >Your emotions - my story.</p>
      <p
        class="subtitle"
        data-aos="fade-up"
        data-aos-delay="200"
        th:unless="${theme.config?.hero?.hero_subtitle != null and not #strings.isEmpty(theme.config.hero.hero_subtitle)}"
      >摄影作品集 & 视觉故事。</p>

      <div class="actions" data-aos="zoom-in" data-aos-delay="400">
        <a
          class="btn btn-primary"
          th:if="${theme.config?.hero?.hero_cta_link != null and not #strings.isEmpty(theme.config.hero.hero_cta_link)}"
          th:href="${theme.config.hero.hero_cta_link}"
          th:text="${theme.config?.hero?.hero_cta_text ?: '查看作品'}"
        >查看作品</a>
        <a
          class="btn btn-primary"
          th:unless="${theme.config?.hero?.hero_cta_link != null and not #strings.isEmpty(theme.config.hero.hero_cta_link)}"
          href="#work"
          th:text="${theme.config?.hero?.hero_cta_text ?: '查看作品'}"
        >查看作品</a>
      </div>
    </section>
  </th:block>
</html>
