<!-- Post detail (default template). Layout uses a two-column body when sidebar is enabled. -->
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: layout(title = |${post.spec.title} - ${site.title}|, content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="container" th:classappend="${theme.config?.layout?.show_sidebar} ? 'layout-two-col' : ''">
      <article class="content article">
        <header class="article-header">
          <h1 th:text="${post.spec.title}">Post Title</h1>
          <div class="article-meta">
            <time
              th:datetime="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
              th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd HH:mm')}"
            ></time>
            <span
              th:if="${post.owner != null}"
            >· by <a th:href="@{|/authors/${post.spec.owner}|}" th:text="${post.owner.displayName}">作者</a></span>
            <span
              th:if="${post.categories != null and not #lists.isEmpty(post.categories)}"
            >· in
              <a
                th:each="cat,iter : ${post.categories}"
                th:href="@{${cat.status.permalink}}"
                th:text="|${cat.spec.displayName}${iter.last ? '' : ', '}|"
              ></a>
            </span>
          </div>
        </header>

        <div class="article-content" th:utext="${post.content.content}">
          Post content goes here.
        </div>

        <footer class="article-footer" th:if="${post.tags != null and not #lists.isEmpty(post.tags)}">
          <div class="tag-list">
            <a
              class="tag"
              th:each="tag : ${post.tags}"
              th:href="@{${tag.status.permalink}}"
              th:text="${tag.spec.displayName}"
            ></a>
          </div>
        </footer>

        <!-- Prev/Next navigation via postFinder.cursor -->
        <nav class="post-nav" th:with="cursor = ${postFinder.cursor(post.metadata.name)}">
          <a
            th:if="${cursor.hasPrevious()}"
            th:href="@{${cursor.previous.status.permalink}}"
            class="prev"
          >
            <div class="label">&lsaquo; 上一篇</div>
            <div class="title" th:text="${cursor.previous.spec.title}">上一篇</div>
          </a>
          <a
            th:if="${cursor.hasNext()}"
            th:href="@{${cursor.next.status.permalink}}"
            class="next"
          >
            <div class="label">下一篇 &rsaquo;</div>
            <div class="title" th:text="${cursor.next.spec.title}">下一篇</div>
          </a>
        </nav>

        <!-- Comment extension point — only renders when a comment plugin is installed and enabled -->
        <div th:if="${haloCommentEnabled}">
          <halo:comment
            group="content.halo.run"
            kind="Post"
            th:attr="name=${post.metadata.name}"
          />
        </div>
      </article>

      <!-- Optional sidebar: recent posts + tag cloud -->
      <aside
        class="sidebar"
        th:if="${theme.config?.layout?.show_sidebar}"
        th:with="
          recentPosts = ${postFinder.list(1, 5)},
          allTags     = ${tagFinder.listAll()}"
      >
        <section class="sidebar-card">
          <h4>最新文章</h4>
          <ul>
            <li th:each="p : ${recentPosts.items}">
              <a th:href="@{${p.status.permalink}}" th:text="${p.spec.title}"></a>
            </li>
          </ul>
        </section>
        <section class="sidebar-card">
          <h4>标签</h4>
          <div class="tag-list">
            <a
              class="tag"
              th:each="t : ${allTags}"
              th:href="@{${t.status.permalink}}"
              th:text="${t.spec.displayName}"
            ></a>
          </div>
        </section>
      </aside>
    </div>
  </th:block>
</html>
