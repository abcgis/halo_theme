<!-- Tag index: list of all tags with post counts. -->
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: layout(title = |Tags - ${site.title}|, content = ~{::content})}">
  <th:block th:fragment="content">
    <section class="page-header">
      <div class="container">
        <h1>Tags</h1>
        <p>Browse posts by tag.</p>
      </div>
    </section>

    <div class="container">
      <th:block th:if="${tags != null and not #lists.isEmpty(tags.items)}">
        <div class="tag-list" style="gap:0.5rem;">
          <a
            class="tag"
            th:each="tag : ${tags.items}"
            th:href="@{${tag.status.permalink}}"
            th:text="|${tag.spec.displayName} (${tag.postCount ?: 0})|"
          ></a>
        </div>
      </th:block>

      <div class="empty" th:unless="${tags != null and not #lists.isEmpty(tags.items)}">
        <p>No tags yet.</p>
      </div>
    </div>
  </th:block>
</html>
