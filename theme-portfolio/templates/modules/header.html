<!--
  Site header — fixed, transparent → solid on scroll.
  Mobile: hamburger opens a full-viewport overlay nav.
  Active link underline animates with scaleX (origin: 0).
-->
<header th:fragment="header" class="site-header" data-site-header>
  <div class="container">
    <a class="site-brand" th:href="@{/}">
      <img
        th:if="${site.logo != null and not #strings.isEmpty(site.logo)}"
        th:src="${site.logo}"
        alt=""
      />
      <span th:text="${site.title}">Site Title</span>
    </a>

    <!--
      Defensive: menuFinder.getPrimary() can return null on fresh installs
      where no menu has been configured yet. Guard against NPE.
    -->
    <nav class="site-nav" data-site-nav th:with="primary = ${menuFinder.getPrimary()}">
      <th:block th:if="${primary != null and not #lists.isEmpty(primary.menuItems)}">
        <a
          class="nav-link"
          th:each="item : ${primary.menuItems}"
          th:href="@{${item.status.href}}"
          th:text="${item.status.displayName}"
          th:target="${item.spec.target?.value}"
          th:attrappend="data-nav-link=${item.status.href}"
        ></a>
      </th:block>

      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="Toggle color scheme"
        title="Toggle color scheme"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>

      <button
        type="button"
        class="theme-toggle theme-toggle-mobile"
        data-theme-toggle
        aria-label="Toggle color scheme"
        title="Toggle color scheme"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </nav>

    <button
      type="button"
      class="menu-toggle"
      data-menu-toggle
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="site-nav"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>
