<!--
  Site footer — dark band, centered, with social links.
  NOTE: default footer line uses th:with to build the literal outside the
  SpEL expression — see theme-portfolio/README.md "Pitfall 2".
-->
<footer th:fragment="footer" class="site-footer" role="contentinfo">
  <div class="container">
    <p
      th:with="defaultFooter = |© ${#temporals.format(#temporals.createNow(), 'yyyy')} ${site.title}|"
      th:text="${theme.config?.seo?.footer_text ?: defaultFooter}"
    >Footer</p>

    <div class="footer-links" th:if="${theme.config?.seo?.show_rss}">
      <a th:href="@{/rss.xml}">RSS</a>
      <a th:href="@{/sitemap.xml}">Sitemap</a>
      <a th:href="@{/archives}">Archives</a>
    </div>

    <div class="social-links" aria-label="Social links">
      <a th:href="@{/}" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9.5L12 3l9 6.5V21h-6v-6h-6v6H3z"/>
        </svg>
      </a>
      <a href="#" aria-label="GitHub" title="GitHub" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.55v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.73-1.53-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.26 5.68.41.35.78 1.05.78 2.12v3.14c0 .31.21.66.79.55A11.5 11.5 0 0 0 12 .5z"/>
        </svg>
      </a>
      <a href="#" aria-label="Email" title="Email" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M3 7l9 6 9-6"/>
        </svg>
      </a>
    </div>
  </div>
</footer>
