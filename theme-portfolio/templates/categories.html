<!-- Category index: list of all categories with post counts. -->
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: layout(title = |Categories - ${site.title}|, content = ~{::content})}">
  <th:block th:fragment="content">
    <section class="page-header">
      <div class="container">
        <h1>Categories</h1>
        <p>Browse posts by category.</p>
      </div>
    </section>

    <div class="container">
      <th:block th:if="${categories != null and not #lists.isEmpty(categories.items)}">
        <ul class="post-grid">
          <li class="post-card" th:each="cat, iter : ${categories.items}" data-aos="fade-up" th:attr="data-aos-delay=${(iter.index % 3) * 100}">
            <div class="body">
              <h3>
                <a th:href="@{${cat.status.permalink}}" th:text="${cat.spec.displayName}">Category</a>
              </h3>
              <p
                class="excerpt"
                th:if="${cat.spec.description != null and not #strings.isEmpty(cat.spec.description)}"
                th:text="${cat.spec.description}"
              ></p>
              <div class="meta">
                <span th:text="|${cat.postCount ?: 0} posts|">0 posts</span>
              </div>
            </div>
          </li>
        </ul>
      </th:block>

      <div class="empty" th:unless="${categories != null and not #lists.isEmpty(categories.items)}">
        <p>No categories yet.</p>
      </div>
    </div>
  </th:block>
</html>
