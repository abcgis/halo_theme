<!--
  Contact page — dedicated template for contact information and messaging.
  To use: create a page in Halo Console and select "Contact" template.
  Pulls contact info and social links from theme settings.
-->
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: layout(title = |联系我们 - ${site.title}|, content = ~{::content})}">
  <th:block th:fragment="content">
    <section class="section container" aria-label="联系我们">
      <div class="contact-layout" style="display: grid; grid-template-columns: 1fr 1fr; gap: 64px; max-width: 900px; margin: 0 auto;">
        <!-- Contact info -->
        <div data-aos="fade-up" data-aos-delay="200">
          <h3 class="gold-heading" style="font-size: 1.5rem;">联系方式</h3>

          <ul style="list-style: none; padding: 0; margin: 0;">
            <li th:if="${theme.config?.social?.social_email != null and not #strings.isEmpty(theme.config.social.social_email)}" style="padding: 12px 0;">
              <a th:href="|mailto:${theme.config.social.social_email}|" style="display: flex; align-items: center; gap: 12px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <rect x="3" y="5" width="18" height="14" rx="2"/>
                  <path d="M3 7l9 6 9-6"/>
                </svg>
                <span style="font-size: 1.1rem; color: var(--color-fg);" th:text="${theme.config.social.social_email}">your_email@example.com</span>
              </a>
            </li>

            <li th:if="${theme.config?.social?.social_phone != null and not #strings.isEmpty(theme.config.social.social_phone)}" style="padding: 12px 0;">
              <a th:href="|tel:${theme.config.social.social_phone}|" style="display: flex; align-items: center; gap: 12px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <span style="font-size: 1.1rem; color: var(--color-fg);" th:text="${theme.config.social.social_phone}">+907 (123) 456-78-90</span>
              </a>
            </li>

            <li th:if="${theme.config?.social?.social_instagram != null and not #strings.isEmpty(theme.config.social.social_instagram)}" style="padding: 12px 0;">
              <a th:href="${theme.config.social.social_instagram}" rel="noopener" target="_blank" style="display: flex; align-items: center; gap: 12px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                  <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
                </svg>
                <span style="font-size: 1.1rem; color: var(--color-fg);">@your_instagram</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Contact form -->
        <div data-aos="fade-up" data-aos-delay="400">
          <form
            class="contact-form"
            onsubmit="event.preventDefault(); alert('感谢您的留言！这是演示表单 — 集成后端后可接收消息。');"
          >
            <div class="form-group">
              <label for="cf-name">您的姓名</label>
              <input type="text" id="cf-name" name="name" required />
            </div>
            <div class="form-group">
              <label for="cf-email">您的邮箱</label>
              <input type="email" id="cf-email" name="email" required />
            </div>
            <div class="form-group">
              <label for="cf-subject">主题</label>
              <input type="text" id="cf-subject" name="subject" />
            </div>
            <div class="form-group">
              <label for="cf-message">留言内容</label>
              <textarea id="cf-message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">发送</button>
          </form>
        </div>
      </div>

      <style>
        @media (max-width: 768px) {
          .contact-layout {
            grid-template-columns: 1fr;
            gap: 48px;
          }
        }
      </style>
    </section>
  </th:block>
</html>
